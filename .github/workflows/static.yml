Conversa durante a atividade de memória

Para continuar pensando

## O que faz alguém querer acordar todos os dias?

Não acho que exista uma resposta única. Para alguém, pode ser a família; para outra pessoa, os amigos, o trabalho, o esporte, uma conversa ou uma atividade aparentemente pequena. Eu não sei exatamente quais eram os motivos de cada um, mas saí pensando que perguntar sobre aquilo que importa para uma pessoa também pode fazer parte do cuidado.

> Envelhecer não apaga a história de ninguém.

O papel do cuidado também é garantir que essa história continue podendo ser contada.

