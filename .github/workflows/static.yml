Introdução

## Quando a teoria encontrou a vida real

Durante quatro quintas-feiras, tive a oportunidade de conhecer dois espaços voltados à população idosa: um Centro de Convivência para Idosos (CCI) e uma Instituição de Longa Permanência para Idosos (ILPI). Foram duas manhãs em cada instituição, nas quais participamos de atividades, conversamos com os idosos e, principalmente, tivemos a oportunidade de observar suas rotinas e ouvir suas histórias.

No início, imaginei que seria uma experiência principalmente voltada para conhecer os serviços. Com o passar das visitas, porém, percebi que estar ali também me fazia pensar sobre autonomia, vínculos familiares, atividade física, memória, socialização, pertencimento, individualidade e até aquilo que dá sentido à vida de uma pessoa.

> Envelhecer não é deixar de viver: é continuar tendo histórias, vínculos, escolhas, movimento e motivos para acordar todos os dias.

A OMS não define envelhecimento saudável como ausência de doenças, mas como a manutenção da capacidade funcional que permite à pessoa ser e fazer aquilo que considera importante (WORLD HEALTH ORGANIZATION, 2020).

CCI × ILPI

## Dois espaços, duas formas de cuidado

### ILPI

Caráter residencial; moradia coletiva de pessoas com 60 anos ou mais, com ou sem suporte familiar. Para quem reside ali, aquele espaço é sua casa (AGÊNCIA NACIONAL DE VIGILÂNCIA SANITÁRIA, 2020).

### CCI

Os idosos continuam em suas próprias casas e frequentam o espaço para participar de atividades, conviver e encontrar outras pessoas (MUDREY; FLORIANO; CAMPOS, 2023).

> Não acho que isso permita dizer que um modelo seja simplesmente "melhor" ou "pior" que o outro.

São propostas diferentes e atendem pessoas com necessidades diferentes. Ainda assim, conhecer os dois me fez perceber como o ambiente em que envelhecemos pode interferir na nossa autonomia, nos nossos vínculos e na forma como vivenciamos o cotidiano.

