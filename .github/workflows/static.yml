Um relato

## Dona Erta — uma história que precisava ser ouvida

"Naquele momento, percebi que talvez escutar também seja uma forma de cuidar."

No primeiro dia na ILPI, passei boa parte da manhã conversando com uma senhora de 90 anos, Dona Erta. Extremamente lúcida, ela começou a me contar histórias de sua vida: o casamento de aproximadamente 70 anos, o quanto havia amado o marido, que já havia falecido. A saudade ainda estava muito presente.

Também tive a impressão de perceber nela uma saudade muito grande da família. Evidentemente, eu não conhecia a realidade daquela família e não poderia julgar os motivos daquela distância. Isso me fez pensar que uma pessoa pode receber todos os cuidados necessários e, mesmo assim, sentir falta de algo que nenhuma rotina organizada consegue substituir completamente: o vínculo com pessoas importantes para ela.

\[INSERIR FOTO — cartão de memória, sem dados pessoais\]

Cartão de memória produzido durante a visita

Reuni algumas das histórias que ela havia contado em um cartão de memória. Na semana seguinte, ela recebia a visita de um filho. Entreguei o cartão e sua reação me marcou muito: ficou extremamente feliz e agradecida. Foi um gesto muito simples. Eu apenas tinha escutado e mostrado que me lembrava.

Movimento

## Pequenas atividades, grandes significados

Na ILPI, participamos de dinâmicas de coordenação motora e de momentos de alongamento. Alguns residentes apresentavam limitações motoras, mas isso não significava falta de vontade: queriam jogar, tentar e até demonstravam uma competitividade divertida entre si.

> Limitação funcional não significa ausência de desejos.

