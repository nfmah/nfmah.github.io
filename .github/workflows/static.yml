## "Vamos caminhar?"

\[FOTO GRANDE — caminhada\]

Caminhada com participantes do CCI

"Eu estava vendo pessoas felizes porque teriam a oportunidade de caminhar."

Quando propusemos uma caminhada, ficaram muito felizes. Alguns comentaram que o professor de Educação Física que realizava atividades na instituição havia saído, e práticas de que gostavam, como caminhadas e vôlei adaptado, tinham deixado de acontecer.

A atividade física na velhice contribui para a mobilidade e para a preservação da capacidade funcional (WORLD HEALTH ORGANIZATION, 2022). Naquela manhã, porém, eu não pensava em diretrizes: olhava para pessoas felizes por poder caminhar.

## Um jogador de futebol aos 85 anos

Um residente de 85 anos contou que veio do Paraná e que, quando jovem, jogou futebol. Diante de mim não estava apenas "um senhor de 85 anos", mas também o jovem que ele havia sido. Envelhecer não apaga aquilo que uma pessoa foi. Como destaca a OMS, não existe um "idoso típico" (WORLD HEALTH ORGANIZATION, 2025).

No CCI

## Memória, estresse e balões

Conversamos sobre como situações estressantes interferem na atenção, na memória e no bem-estar e, para não ser uma fala puramente expositiva, usamos balões: os participantes os enchiam conforme o quanto cada situação os incomodava. Alguns estouraram e todos riram bastante. Depois, um jogo de memória em grupo: cada pessoa repetia o que já havia sido dito e acrescentava algo novo.

\[INSERIR FOTO — dinâmica dos balões\]

Dinâmica dos balões no CCI

A atividade deixou de ser algo que levávamos "para eles" e passou a depender da participação deles para funcionar.

## Quando o CCI deixa de ser apenas um lugar

Aqueles idosos não estavam ali para "ocupar o tempo". Havia atividades que esperavam durante a semana, pessoas que encontravam, conversas, caminhadas e campeonatos de bocha. Um espaço assim permite que a pessoa continue se sentindo parte de uma comunidade (MUDREY; FLORIANO; CAMPOS, 2023).

Sentido

## O que o ikigai me fez pensar

Lembrei do conceito japonês de ikigai, frequentemente relacionado a sentido, propósito ou razão para viver. Não acho adequado transformá-lo em fórmula pronta. Um estudo longitudinal com idosos japoneses encontrou associações entre ikigai e indicadores posteriores de saúde e bem-estar; por ser observacional, não permite afirmar que seja a causa (OKUZONO et al., 2022).

> Talvez o propósito não precise ser algo grandioso.

um campeonato de bocha para esperarencontrar os amigosparticipar de uma caminhadacontar uma históriater alguém para conversar

Envelhecer com qualidade talvez envolva não apenas viver por mais anos, mas continuar encontrando razões para participar da própria vida.

Contraste

## O contraste entre o CCI e a ILPI

No CCI, os idosos encontravam uma rede adicional àquela que já possuíam. Na ILPI, a instituição era o lugar onde dormiam, acordavam, comiam e viviam grande parte da rotina, necessariamente mais coletiva. Reconheci o cuidado dos profissionais e pensei no desafio de preservar aquilo que é individual dentro de uma rotina coletiva.

Isso não significa considerar a institucionalização negativa: uma ILPI pode oferecer proteção, cuidado e suporte difíceis de garantir de outra maneira. Cuidar também exige, sempre que possível, preservar escolhas, vínculos e aquilo que faz a pessoa continuar sendo ela mesma.

Conclusão acadêmica

## O que essas visitas me ensinaram sobre Atenção Primária

"Cuidar da pessoa, e não apenas da doença."

promoção da saúdeprevençãoautonomiafuncionalidadevínculosparticipação socialeducação em saúdecuidado centrado na pessoa

Depois dessas quatro manhãs, ficou concreto que saúde também envolve autonomia, vínculo, movimento, participação social, memória, ambiente e qualidade de vida. Nas visitas não realizávamos consultas: conversávamos, estimulávamos movimento, fazíamos educação em saúde, criávamos convivência ou simplesmente ouvíamos. Tudo isso também era cuidado (WORLD HEALTH ORGANIZATION, 2020; 2025).

Protótipo: "promoção da saúde" e "prevenção" não são desenvolvidas no texto original; considere acrescentar uma frase sua sobre elas.

Formação

## O que eu levo para a minha formação médica

Ao longo das quatro semanas, passei de uma preocupação em realizar corretamente as atividades para valorizar o que surgia espontaneamente nas conversas. Muitas informações importantes não aparecem porque fizemos a "pergunta certa", mas porque oferecemos tempo e espaço para a pessoa falar.

> Idade não resume ninguém.

Como futura médica, acredito que uma das principais coisas que posso levar é a disposição para enxergar a pessoa antes de enxergar apenas o paciente.

